<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>blockGrider 영역 검사 2.0 </title>
<link rel="stylesheet" href="pixel_region_tool.css">
</head>
<body>

<header>
  <h1>픽셀 영역 검사 도구</h1>
  <div class="subtitle">클립보드 이미지를 붙여넣고(Ctrl+V), 확대 캔버스에서 정사각 영역을 골라 흰색 여부를 검사합니다.</div>
</header>

<div class="layout">

  <div class="controls">
    <div class="field">
      <label for="zoomSelect">확대 배율 (tarCanvas)</label>
      <select id="zoomSelect"></select>
    </div>

    <div class="field">
      <label for="sizeSelect">선택 영역 한 변 길이 (px)</label>
      <select id="sizeSelect"></select>
    </div>

    <div class="field">
      <label for="toleranceInput">흰색 판정 톨러런스 (0~255)</label>
      <input type="number" id="toleranceInput" min="0" max="255" value="255">
    </div>

    <div class="field">
      <label for="shiftSRangeInput">Shift+S 각도 범위 (0~90°)</label>
      <div class="range-row">
        <input type="range" id="shiftSRangeInput" min="0" max="90" step="5" value="45">
        <span id="shiftSRangeValue">45°</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="info-line"><span>이미지 크기</span><span id="infoSize">-</span></div>
    <div class="info-line"><span>선택 위치</span><span id="infoSel">-</span></div>
    <div class="info-line"><span>노란 영역 개수</span><span class="region-count" id="infoCount">0</span></div>

    <div class="field">
      <label for="groupSelect">현재 그룹 (Group)</label>
      <select id="groupSelect"></select>
    </div>

    <div class="info-line"><span>최근 그룹</span><span id="infoGroupHistory">-</span></div>

    <div class="divider"></div>

    <button id="clearRegionsBtn">노란 영역 전체 해제</button>
    <button id="resetAllBtn">이미지 및 저장 데이터 초기화</button>

    <div class="divider"></div>

    <div class="keys-summary" id="keyHelpSummary" tabindex="0" role="button" aria-label="키 사용법 자세히 보기">
      키 사용법 보기
    </div>

    <div class="status" id="statusLine" tabindex="0"></div>
  </div>

  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <div class="status-overlay" id="statusOverlay" aria-hidden="true">
    <div class="status-dialog" id="statusDialog" role="dialog" aria-modal="true" aria-labelledby="statusOverlayTitle">
      <div class="status-dialog-header">
        <h3 id="statusOverlayTitle">상세 메시지</h3>
        <button type="button" class="status-close" id="statusCloseBtn" aria-label="닫기">×</button>
      </div>
      <div class="status-dialog-body" id="statusOverlayContent"></div>
    </div>
  </div>

  <div class="canvases">
    <div class="canvas-block">
      <h2>원본 캔버스 (srcCanvas)</h2>
      <div class="canvas-scroll">
        <canvas id="srcCanvas" width="1" height="1"></canvas>
        <div class="empty-hint" id="emptyHintSrc">이미지가 없습니다. 화면에 포커스를 둔 상태에서 Ctrl+V로 이미지를 붙여넣으세요.</div>
      </div>
    </div>

    <div class="canvas-block">
      <h2>확대 캔버스 (tarCanvas) — 클릭으로 영역 선택, IJKL로 이동, F8/Shift+F8 및 방향 키로 후보 탐색</h2>
      <div class="canvas-scroll">
        <canvas id="tarCanvas" width="1" height="1"></canvas>
      </div>
    </div>
  </div>

</div>

<script src="pixel_region_tool.js"></script>

</body>
</html>
