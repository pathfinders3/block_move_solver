<!DOCTYPE html>

<style>
  :root{

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif;

    font-size: 1.15rem;

  .layout{
    display: flex;

    flex: 0 0 260px;

  select, input[type=number]{
    background: #101317;

    border-radius: 6px;

  select:focus, input:focus{
    outline: 1px solid var(--accent);

  button{
    background: #101317;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 9px 10px;

    font-size: 0.85rem;
  }
  button:hover{
    border-color: var(--accent);
    color: var(--accent);
  }
  .divider{
    height: 1px;
    background: var(--panel-border);
    margin: 2px 0;
  }
  .info-line{
    font-size: 0.8rem;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }
  .info-line span:last-child{ color: var(--text); }
  .keys{
    font-size: 0.78rem;
    color: var(--text-dim);
    line-height: 1.7;
  }
  .keys b{
    color: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #101317;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 1px 6px;
    margin-right: 4px;
  }
  .canvases{
    flex: 1 1 480px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 320px;
  }
  .canvas-block{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px;
  }
  .canvas-block h2{
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-dim);
    margin: 0 0 10px;
    text-transform: none;
  }
  .canvas-scroll{
    max-height: 60vh;
    overflow: auto;
    background:
      linear-gradient(45deg, #10131a 25%, transparent 25%),
      linear-gradient(-45deg, #10131a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #10131a 75%),
      linear-gradient(-45deg, transparent 75%, #10131a 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: #0c0e12;
    border-radius: 6px;
    border: 1px solid var(--panel-border);
  }
  canvas{
    display: block;
    image-rendering: pixelated;
  }
  #srcCanvas{ image-rendering: auto; }
  .empty-hint{
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 40px 20px;
    text-align: center;
  }
  .status{
    font-size: 0.78rem;
    margin-top: 8px;
    min-height: 16px;
    color: var(--accent);
  }
  .status.warn{ color: var(--warn); }
  .region-count{
    color: var(--yellow);
    font-weight: 600;
  }
</style>

<body>

</header>

<div class="layout">

  <div class="controls">
    <div class="field">
      <label for="zoomSelect">?뺣? 諛곗쑉 (tarCanvas)</label>

    <button id="clearRegionsBtn">?몃? ?곸뿭 ?꾩껜 ?댁젣</button>

    <div class="keys">
      <div><b>Ctrl+V</b> ?대?吏 遺숈뿬?ｊ린</div>
      <div><b>?대┃</b> ?뺣? 罹붾쾭?ㅼ뿉???좏깮 ?곸뿭 ?대룞 / ?몃? ?곸뿭 ?좏깮</div>
      <div><b>I J K L</b> ?좏깮 ?곸뿭 ??醫??????대룞</div>
      <div><b>F8</b> ?곗깋 寃?????몃???移좏븯湲?/div>
      <div><b>Delete</b> ?좏깮???몃? ?곸뿭 ?댁젣</div>
    </div>

    <div class="status" id="statusLine"></div>
  </div>

  <div class="canvases">
    <div class="canvas-block">
      <h2>?먮낯 罹붾쾭??(srcCanvas)</h2>
      <div class="canvas-scroll">
        <canvas id="srcCanvas" width="1" height="1"></canvas>
        <div class="empty-hint" id="emptyHintSrc">?대?吏媛 ?놁뒿?덈떎. ?붾㈃???ъ빱?ㅻ? ???곹깭?먯꽌 Ctrl+V濡??대?吏瑜?遺숈뿬?ｌ쑝?몄슂.</div>
      </div>
    </div>

    <div class="canvas-block">
      <h2>?뺣? 罹붾쾭??(tarCanvas) ???대┃?쇰줈 ?곸뿭 ?좏깮, IJKL濡??대룞, F8濡?寃??/h2>
      <div class="canvas-scroll">
        <canvas id="tarCanvas" width="1" height="1"></canvas>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  const MAX_TAR_DIM = 8000; // ?덉쟾 ?곹븳: ?뺣? 罹붾쾭?ㅺ? ?덈Т 而ㅼ???寃껋쓣 諛⑹?

  const srcCanvas = document.getElementById('srcCanvas');
  const tarCanvas = document.getElementById('tarCanvas');
  const emptyHintSrc = document.getElementById('emptyHintSrc');
  const zoomSelect = document.getElementById('zoomSelect');
  const sizeSelect = document.getElementById('sizeSelect');
  const toleranceInput = document.getElementById('toleranceInput');
  const infoSize = document.getElementById('infoSize');
  const infoSel = document.getElementById('infoSel');
  const infoCount = document.getElementById('infoCount');
  const statusLine = document.getElementById('statusLine');
  const clearRegionsBtn = document.getElementById('clearRegionsBtn');
  const resetAllBtn = document.getElementById('resetAllBtn');

  // populate zoom select 2..16
  for(let z=2; z<=16; z++){
    const opt = document.createElement('option');
    opt.value = z; opt.textContent = z + '諛?;
    if(z===4) opt.selected = true;
    zoomSelect.appendChild(opt);
  }
  // populate square size select 1..8 (side length)
  for(let s=1; s<=8; s++){
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s + ' x ' + s;
    if(s===3) opt.selected = true;
    sizeSelect.appendChild(opt);
  }

  const baseCanvas = document.createElement('canvas'); // pristine pixel source, never painted on
  const baseCtx = baseCanvas.getContext('2d', { willReadFrequently: true });

  const state = {
    img: null,
    width: 0,
    height: 0,
    zoom: parseInt(zoomSelect.value, 10),
    squareSize: parseInt(sizeSelect.value, 10),
    tolerance: parseInt(toleranceInput.value, 10),
    selection: null,          // {x,y,size}
    yellowRegions: [],        // [{x,y,size}]
    selectedRegionIndex: null
  };

  // ---------- IndexedDB persistence ----------
  function idbOpen(){
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open('pixelRegionToolDB', 1);
      req.onupgradeneeded = ()=> { req.result.createObjectStore('kv'); };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  }
  async function idbSet(key, value){
    const db = await idbOpen();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
  }
  async function idbGet(key){
    const db = await idbOpen();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  }
  async function idbDelete(key){
    const db = await idbOpen();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').delete(key);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
  }

  async function saveMeta(){
    try{
      await idbSet('meta', {
        zoom: state.zoom,
        squareSize: state.squareSize,
        tolerance: state.tolerance,
        yellowRegions: state.yellowRegions,
        width: state.width,
        height: state.height
      });
    }catch(e){ /* ignore persistence errors */ }
  }

  async function restoreOnLoad(){
    try{
      const blob = await idbGet('pastedImage');
      if(blob){
        await loadImageBlob(blob, false);
        const meta = await idbGet('meta');
        if(meta && meta.width === state.width && meta.height === state.height){
          state.zoom = clampZoomForSize(meta.zoom || state.zoom);
          state.squareSize = meta.squareSize || state.squareSize;
          state.tolerance = (meta.tolerance===undefined) ? state.tolerance : meta.tolerance;
          state.yellowRegions = Array.isArray(meta.yellowRegions) ? meta.yellowRegions : [];
          zoomSelect.value = state.zoom;
          sizeSelect.value = state.squareSize;
          toleranceInput.value = state.tolerance;
        }
        state.selection = { x:0, y:0, size: state.squareSize };
        render();
        setStatus('?댁쟾 ?몄뀡???대?吏瑜?遺덈윭?붿뒿?덈떎.', false);
      }
    }catch(e){ /* no saved image, ignore */ }
  }

  // ---------- image loading ----------
  function clampZoomForSize(z){
    if(!state.width || !state.height) return z;
    let maxZ = z;
    while(maxZ > 1 && (state.width*maxZ > MAX_TAR_DIM || state.height*maxZ > MAX_TAR_DIM)){
      maxZ--;
    }
    return Math.max(1, Math.min(16, maxZ));
  }

  function loadImageBlob(blob, resetRegions){
    return new Promise((resolve, reject)=>{
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = ()=>{
        state.img = img;
        state.width = img.naturalWidth;
        state.height = img.naturalHeight;

        baseCanvas.width = state.width;
        baseCanvas.height = state.height;
        baseCtx.imageSmoothingEnabled = false;
        baseCtx.clearRect(0,0,state.width,state.height);
        baseCtx.drawImage(img, 0, 0);

        const safeZoom = clampZoomForSize(state.zoom);
        if(safeZoom !== state.zoom){
          state.zoom = safeZoom;
          zoomSelect.value = safeZoom;
          setStatus('?대?吏媛 而ㅼ꽌 ?뺣? 諛곗쑉??' + safeZoom + '諛곕줈 ?쒗븳?덉뒿?덈떎.', true);
        }

        if(resetRegions){
          state.yellowRegions = [];
          state.selectedRegionIndex = null;
          state.selection = { x:0, y:0, size: state.squareSize };
        }

        emptyHintSrc.style.display = 'none';
        URL.revokeObjectURL(url);
        resolve();
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  // ---------- rendering ----------
  function drawRegionsOn(ctx, scale){
    state.yellowRegions.forEach((r, idx)=>{
      const selected = (idx === state.selectedRegionIndex);
      ctx.fillStyle = selected ? '#ffb84d' : '#f4d35e';
      ctx.fillRect(r.x*scale, r.y*scale, r.size*scale, r.size*scale);
      if(selected){
        ctx.lineWidth = Math.max(2, scale/3);
        ctx.strokeStyle = '#ff6b6b';
        ctx.strokeRect(r.x*scale + ctx.lineWidth/2, r.y*scale + ctx.lineWidth/2,
                        r.size*scale - ctx.lineWidth, r.size*scale - ctx.lineWidth);
      }
    });
  }

  function drawSelectionOn(ctx, scale){
    if(!state.selection) return;
    const s = state.selection;
    ctx.lineWidth = Math.max(2, scale/4);
    ctx.strokeStyle = '#5ee6c8';
    ctx.setLineDash(scale >= 4 ? [scale/2, scale/4] : []);
    ctx.strokeRect(s.x*scale + ctx.lineWidth/2, s.y*scale + ctx.lineWidth/2,
                    s.size*scale - ctx.lineWidth, s.size*scale - ctx.lineWidth);
    ctx.setLineDash([]);
  }

  function render(){
    if(!state.img) return;

    // src canvas (1:1)
    srcCanvas.width = state.width;
    srcCanvas.height = state.height;
    const sctx = srcCanvas.getContext('2d');
    sctx.imageSmoothingEnabled = false;
    sctx.clearRect(0,0,state.width,state.height);
    sctx.drawImage(baseCanvas, 0, 0);
    drawRegionsOn(sctx, 1);
    drawSelectionOn(sctx, 1);

    // tar canvas (zoomed)
    const z = state.zoom;
    tarCanvas.width = state.width * z;
    tarCanvas.height = state.height * z;
    const tctx = tarCanvas.getContext('2d');
    tctx.imageSmoothingEnabled = false;
    tctx.clearRect(0,0,tarCanvas.width, tarCanvas.height);
    tctx.drawImage(baseCanvas, 0, 0, state.width, state.height, 0, 0, state.width*z, state.height*z);
    drawRegionsOn(tctx, z);
    drawSelectionOn(tctx, z);

    updateInfo();
  }

  function updateInfo(){
    infoSize.textContent = state.img ? (state.width + ' x ' + state.height) : '-';
    infoSel.textContent = state.selection ? ('(' + state.selection.x + ', ' + state.selection.y + ') ' + state.selection.size + 'x' + state.selection.size) : '-';
    infoCount.textContent = state.yellowRegions.length;
  }

  function setStatus(msg, isWarn){
    statusLine.textContent = msg;
    statusLine.className = 'status' + (isWarn ? ' warn' : '');
  }

  // ---------- paste handling ----------
  window.addEventListener('paste', async (e)=>{
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(const item of items){
      if(item.type && item.type.startsWith('image/')){
        const blob = item.getAsFile();
        if(!blob) continue;
        e.preventDefault();
        try{
          await loadImageBlob(blob, true);
          render();
          setStatus('?대?吏瑜?遺숈뿬?ｌ뿀?듬땲??', false);
          try{
            await idbSet('pastedImage', blob);
            await saveMeta();
          }catch(err){
            setStatus('?대?吏瑜???ν븯吏 紐삵뻽?듬땲??(?⑸웾 ?쒗븳?????덉쓬). ?덈줈怨좎묠 ???щ씪吏????덉뒿?덈떎.', true);
          }
        }catch(err){
          setStatus('?대?吏瑜?遺덈윭?ㅻ뒗 ???ㅽ뙣?덉뒿?덈떎.', true);
        }
        break;
      }
    }
  });

  // ---------- controls ----------
  zoomSelect.addEventListener('change', ()=>{
    let z = parseInt(zoomSelect.value, 10);
    const safe = clampZoomForSize(z);
    if(safe !== z){
      zoomSelect.value = safe;
      setStatus('?대?吏媛 而ㅼ꽌 ?뺣? 諛곗쑉??' + safe + '諛곕줈 ?쒗븳?덉뒿?덈떎.', true);
    }
    state.zoom = safe;
    render();
    saveMeta();
  });

  sizeSelect.addEventListener('change', ()=>{
    state.squareSize = parseInt(sizeSelect.value, 10);
    if(state.selection && state.img){
      state.selection.size = state.squareSize;
      state.selection.x = Math.min(state.selection.x, Math.max(0, state.width - state.squareSize));
      state.selection.y = Math.min(state.selection.y, Math.max(0, state.height - state.squareSize));
    }
    render();
    saveMeta();
  });

  toleranceInput.addEventListener('change', ()=>{
    let v = parseInt(toleranceInput.value, 10);
    if(isNaN(v)) v = 255;
    v = Math.max(0, Math.min(255, v));
    toleranceInput.value = v;
    state.tolerance = v;
    saveMeta();
  });

  clearRegionsBtn.addEventListener('click', ()=>{
    state.yellowRegions = [];
    state.selectedRegionIndex = null;
    render();
    saveMeta();
    setStatus('紐⑤뱺 ?몃? ?곸뿭???댁젣?덉뒿?덈떎.', false);
  });

  resetAllBtn.addEventListener('click', async ()=>{
    if(!confirm('??λ맂 ?대?吏? 紐⑤뱺 ?몃? ?곸뿭 ?곗씠?곕? ??젣?좉퉴??')) return;
    state.img = null;
    state.width = 0; state.height = 0;
    state.yellowRegions = [];
    state.selection = null;
    state.selectedRegionIndex = null;
    srcCanvas.width = 1; srcCanvas.height = 1;
    tarCanvas.width = 1; tarCanvas.height = 1;
    emptyHintSrc.style.display = 'block';
    updateInfo();
    try{ await idbDelete('pastedImage'); }catch(e){}
    try{ await idbDelete('meta'); }catch(e){}
    setStatus('珥덇린?붾릺?덉뒿?덈떎.', false);
  });

  // ---------- click on tarCanvas ----------
  tarCanvas.addEventListener('click', (e)=>{
    if(!state.img) return;
    const rect = tarCanvas.getBoundingClientRect();
    const scaleX = tarCanvas.width / rect.width;
    const scaleY = tarCanvas.height / rect.height;
    const cx = (e.clientX - rect.left) * scaleX;
    const cy = (e.clientY - rect.top) * scaleY;
    const px = Math.floor(cx / state.zoom);
    const py = Math.floor(cy / state.zoom);

    const idx = state.yellowRegions.findIndex(r =>
      px >= r.x && px < r.x + r.size && py >= r.y && py < r.y + r.size
    );

    if(idx >= 0){
      state.selectedRegionIndex = idx;
      setStatus('?몃? ?곸뿭???좏깮?덉뒿?덈떎. Delete ?ㅻ줈 ?댁젣?????덉뒿?덈떎.', false);
    }else{
      state.selectedRegionIndex = null;
      const size = state.squareSize;
      const x = Math.min(Math.max(px, 0), Math.max(0, state.width - size));
      const y = Math.min(Math.max(py, 0), Math.max(0, state.height - size));
      state.selection = { x, y, size };
      setStatus('?좏깮 ?곸뿭???대룞?덉뒿?덈떎.', false);
    }
    render();
  });

  // ---------- keyboard ----------
  function isTypingTarget(el){
    return el && (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA');
  }

  function moveSelection(dx, dy){
    if(!state.selection || !state.img) return;
    const s = state.selection;
    s.x = Math.min(Math.max(s.x + dx, 0), Math.max(0, state.width - s.size));
    s.y = Math.min(Math.max(s.y + dy, 0), Math.max(0, state.height - s.size));
    render();
  }

  function checkAndPaint(){
    if(!state.selection || !state.img) return;
    const s = state.selection;
    const data = baseCtx.getImageData(s.x, s.y, s.size, s.size).data;
    const T = state.tolerance;
    let allWhite = true;
    for(let i=0; i<data.length; i+=4){
      const r = data[i], g = data[i+1], b = data[i+2];
      if(!(r >= T && g >= T && b >= T)){
        allWhite = false;
        break;
      }
    }
    if(allWhite){
      state.yellowRegions.push({ x:s.x, y:s.y, size:s.size });
      setStatus('?곗깋 ?곸뿭???뺤씤?섏뿬 ?몃??됱쑝濡?移좏뻽?듬땲?? (?⑤윭?곗뒪 ' + T + ')', false);
      saveMeta();
    }else{
      setStatus('?좏깮 ?곸뿭???곗깋???꾨떃?덈떎. (?⑤윭?곗뒪 ' + T + ')', true);
    }
    render();
  }

  function deleteSelectedRegion(){
    if(state.selectedRegionIndex === null) return;
    state.yellowRegions.splice(state.selectedRegionIndex, 1);
    state.selectedRegionIndex = null;
    render();
    saveMeta();
    setStatus('?몃? ?곸뿭???댁젣?덉뒿?덈떎.', false);
  }

  window.addEventListener('keydown', (e)=>{
    if(isTypingTarget(document.activeElement)) return;
    if(!state.img) return;

    switch(e.key){
      case 'i': case 'I': moveSelection(0, -1); e.preventDefault(); break;
      case 'k': case 'K': moveSelection(0, 1); e.preventDefault(); break;
      case 'j': case 'J': moveSelection(-1, 0); e.preventDefault(); break;
      case 'l': case 'L': moveSelection(1, 0); e.preventDefault(); break;
      case 'F8': checkAndPaint(); e.preventDefault(); break;
      case 'Delete': case 'Backspace': deleteSelectedRegion(); e.preventDefault(); break;
      default: break;
    }
  });

  // ---------- init ----------
  restoreOnLoad();
})();
</script>

</body>
</html>
