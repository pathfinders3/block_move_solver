<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blockGrider3 Receiver</title>
  <link rel="icon" type="image/png" href="blockGrider3.png">
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2b;
      --text: #e6edf7;
      --muted: #9db0c7;
      --border: #334155;
      --accent: #38bdf8;
      --ok: #86efac;
      --warn: #facc15;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: radial-gradient(circle at 20% 20%, #18233b 0%, var(--bg) 62%);
      color: var(--text);
      font-family: "Consolas", "Menlo", "Monaco", monospace;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      background: #1b2940;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      color: #dbe7f5;
    }

    .status {
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #14532d;
      background: #0f2b1a;
      color: var(--ok);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.warn {
      border-color: #713f12;
      background: #2f1f0f;
      color: var(--warn);
    }

    .viewer-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
      color: var(--muted);
      font-size: 13px;
      flex-wrap: wrap;
    }

    .viewer {
      display: grid;
      grid-template-columns: max-content minmax(220px, 1fr);
      gap: 14px;
      align-items: start;
      margin: 8px 0 14px;
    }

    .viewer-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .viewer-title {
      color: var(--muted);
      font-size: 13px;
    }

    canvas {
      border: 1px solid var(--border);
      background: #030712;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border-radius: 8px;
    }

    .zoom-scroll {
      width: 100%;
      max-width: 100%;
      max-height: 520px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #030712;
      padding: 6px;
    }

    #zoomCanvas {
      display: block;
      border: 0;
      border-radius: 0;
    }

    textarea {
      width: 100%;
      min-height: 520px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      resize: vertical;
      outline: none;
      font-size: 13px;
      line-height: 1.45;
      color: #e2e8f0;
      background: #0a1425;
    }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #0ea5e9;
      background: var(--accent);
      color: #06263b;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>blockGrider3 수신 페이지</h1>
    <p>blockGrider2에서 전달된 JSON을 표시합니다. 정적 HTML 환경에서는 POST 본문을 직접 읽기 어려워 transferKey(localStorage) 방식으로 수신합니다.</p>

    <div class="meta">
      <span id="badgeMethod" class="badge">전달 방식: -</span>
      <span id="badgeGroups" class="badge">그룹: -</span>
      <span id="badgePoints" class="badge">점: -</span>
    </div>

    <div id="status" class="status warn">대기 중...</div>

    <div class="viewer-controls">
      <label for="scaleRange">확대 배율:</label>
      <input type="range" id="scaleRange" min="0" max="5" value="1" step="1">
      <span id="scaleDisplay">4x</span>
      <span>|</span>
      <label for="dpToleranceRange">DP 톨러런스:</label>
      <input type="range" id="dpToleranceRange" min="0" max="8" value="0" step="0.1">
      <span id="dpToleranceDisplay">0.0</span>
      <span>|</span>
      <label for="lineThicknessRange">선 두께:</label>
      <input type="range" id="lineThicknessRange" min="1" max="5" value="1" step="1">
      <span id="lineThicknessDisplay">1</span>
      <span>|</span>
      <label for="colorModeSelect">색상 모드:</label>
      <select id="colorModeSelect">
        <option value="mono" selected>단색 (Gray)</option>
        <option value="segment">채색 (세그먼트별)</option>
      </select>
      <span>|</span>
      <span>비트맵 미리보기</span>
    </div>

    <div class="viewer">
      <div class="viewer-block">
        <div class="viewer-title" id="baseCanvasTitle">원본 64x64</div>
        <canvas id="baseCanvas" width="64" height="64"></canvas>
      </div>
      <div class="viewer-block">
        <div class="viewer-title">확대 보기</div>
        <div class="zoom-scroll">
          <canvas id="zoomCanvas" width="1024" height="1024"></canvas>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="btnCopy" type="button">JSON 복사</button>
      <button id="btnCopyForBg2" type="button">blockGrider2용 JSON 복사</button>
      <button id="btnCopyBitmap" type="button">비트맵 복사(PNG)</button>
      <button id="btnRestoreOriginal" type="button">원본 복원</button>
      <button id="btnReload" type="button">재수신 시도</button>
      <button id="btnSimplifyDp" type="button">DP 단순화 적용</button>
      <button id="btnTogglePathLines" type="button">경로 선 보기: OFF</button>
    </div>

    <textarea id="output" placeholder="전달된 JSON이 여기 표시됩니다."></textarea>
  </div>

  <script src="blockGrider3.js?v=13"></script>
</body>
</html>
