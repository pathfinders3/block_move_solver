<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blockGrider2 JSON Viewer</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2129;
      --panel-2: #222b35;
      --text: #e7edf3;
      --muted: #9fb0c0;
      --accent: #48c78e;
      --accent-border: #3fae7b;
      --danger: #ff7a7a;
      --border: #33404d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Consolas", "Menlo", "Monaco", monospace;
      background: radial-gradient(circle at 20% 20%, #1a2330 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      color: #f2f7fb;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .viewer-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .click-info {
      margin-bottom: 10px;
      color: #cdd9e5;
      font-size: 13px;
    }

    .viewer {
      display: grid;
      grid-template-columns: max-content minmax(220px, 1fr);
      gap: 14px;
      align-items: start;
      margin: 12px 0 16px;
    }

    .viewer-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .viewer-title {
      color: var(--muted);
      font-size: 13px;
    }

    canvas {
      border: 1px solid var(--border);
      background: #0b1117;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border-radius: 8px;
      cursor: crosshair;
    }

    .zoom-scroll {
      width: 100%;
      max-width: 100%;
      max-height: 520px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b1117;
      padding: 6px;
    }

    #zoomCanvas {
      display: block;
      border: 0;
      border-radius: 0;
    }

    button {
      background: var(--accent);
      color: #0f2b1f;
      border: 1px solid var(--accent-border);
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.05);
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .status.error {
      color: var(--danger);
    }

    textarea {
      width: 100%;
      min-height: 460px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1117;
      color: #e9f2fa;
      padding: 14px;
      font-size: 13px;
      line-height: 1.45;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>blockGrider2 JSON 수신</h1>
    <p>Copy Rects로 복사한 JSON을 클립보드에서 읽어 textarea에 표시합니다.</p>

    <div class="controls">
      <button id="btnLoadJson">클립보드 JSON 불러오기</button>
    </div>

    <div id="status" class="status"></div>
    <div class="viewer-controls">
      <label for="scaleRange">확대 배율:</label>
      <input type="range" id="scaleRange" min="0" max="5" value="3" step="1">
      <span id="scaleDisplay">16x</span>
    </div>
    <div id="clickInfo" class="click-info">클릭 좌표: -</div>

    <div class="viewer">
      <div class="viewer-block">
        <div class="viewer-title" id="baseCanvasTitle">원본 64x64</div>
        <canvas id="baseCanvas" width="64" height="64"></canvas>
      </div>
      <div class="viewer-block">
        <div class="viewer-title">확대 보기</div>
        <div class="zoom-scroll">
          <canvas id="zoomCanvas" width="1024" height="1024"></canvas>
        </div>
      </div>
    </div>

    <textarea id="jsonOutput" placeholder="여기에 JSON이 표시됩니다."></textarea>
  </div>

  <script src="blockGrider2.js"></script>
</body>
</html>
